zerops:
  - setup: python
    build:
      base: python@3.12
      deployFiles: .
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      prepareCommands:
        - python3 -m pip install --ignore-installed -r requirements.txt
      ports:
        - port: 8000
      start: python3 app.py
